[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-vlm-training"
version = "0.1.0"
description = "Thin VERL bootstrap for OCR VLM SFT and GRPO training."
requires-python = ">=3.11"
dependencies = [
    "datasets",
    "jinja2",
    "omegaconf",
    "pandas",
    "pyarrow",
    "pyyaml",
    "ray",
    "torch",
    "transformers",
    "verl",
    "wandb",
]

[tool.setuptools]
packages = ["src", "src.data", "src.rewards", "src.callbacks", "src.runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
