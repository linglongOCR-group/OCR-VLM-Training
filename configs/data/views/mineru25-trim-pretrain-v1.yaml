name: mineru25-trim-pretrain-v1
description: "SFT pretraining view — all MinerU_Hybrid_4_23 text/table/formula records plus a deterministic 20,000-document sample from DocBank_500K; excludes layout tasks"
stage: sft
model_family: mineru2.5
prompt_profile: mineru2.5

paths:
  canonical_root: canonical
  view_root: views/mineru25-trim-pretrain-v1

include:
  - task: text
    sources: [MinerU_Hybrid_4_23, DocBank_500K]
  - task: table
    sources: [MinerU_Hybrid_4_23, DocBank_500K]
  - task: formula
    sources: [MinerU_Hybrid_4_23, DocBank_500K]

sample:
  - sources: [DocBank_500K]
    level: document
    count: 2000
    seed: 42

target_serialization:
  table: enhanced_otsl_v1
  formula: latex_plain_v1
  text: plain_text_v1

image_policy:
  materialization:
    mode: embedded

shard_policy:
  rows_per_shard: 128

split_policy:
  level: document
  seed: 42
  train_ratio: 1.0
  val_ratio: 0.0
  test_ratio: 0.0
