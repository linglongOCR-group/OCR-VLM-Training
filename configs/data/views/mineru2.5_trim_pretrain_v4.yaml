name: mineru2.5_trim_pretrain_v4
description: "SFT pretraining view - PubTable1M table, capped Fintech table/text, HaoY formula/text, DocBank table/formula/capped text, and MinerU Hybrid records; MinerU2.5 prompts and nested image references"
stage: sft
model_family: mineru2.5
prompt_profile: mineru2.5

paths:
  canonical_root: canonical
  view_root: views/mineru2.5_trim_pretrain_v4

include:
  - task: table
    sources: [PubTable1M_OTSL, Fintech_Annual_Reports_fixed, DocBank_500K, MinerU_Hybrid_4_23]
  - task: formula
    sources: [HaoY-Syn-Formula, DocBank_500K, MinerU_Hybrid_4_23]
  - task: text
    sources: [Fintech_Annual_Reports_fixed, DocBank_500K, MinerU_Hybrid_4_23, HaoY-Syn-Formula]

sample:
  - sources: [Fintech_Annual_Reports_fixed]
    tasks: [table]
    level: record
    count: 1670880
    seed: 42
  - sources: [Fintech_Annual_Reports_fixed]
    tasks: [text]
    level: record
    count: 2000000
    seed: 42
  - sources: [DocBank_500K]
    tasks: [text]
    level: record
    count: 2500000
    seed: 42

target_serialization:
  table: enhanced_otsl_v1
  formula: latex_plain_v1
  text: plain_text_v1

image_policy:
  materialization:
    mode: nested_reference
  filter:
    max_aspect_ratio: 180

shard_policy:
  rows_per_shard: 10000

split_policy:
  level: document
  seed: 42
  train_ratio: 1.0
  val_ratio: 0.0
  test_ratio: 0.0
