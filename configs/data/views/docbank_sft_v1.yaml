name: DocBank_500K_sft_v1
description: "SFT training view for DocBank_500K — layout, text, table, formula tasks"
stage: sft
model_family: mineru2.5
prompt_profile: mineru2.5

paths:
  canonical_root: canonical
  view_root: views/DocBank_500K_sft_v1

include:
  - task: layout
    sources: [DocBank_500K]
  - task: text
    sources: [DocBank_500K]
  - task: table
    sources: [DocBank_500K]
  - task: formula
    sources: [DocBank_500K]

target_serialization:
  layout: mineru_layout_box_v1
  table: enhanced_otsl_v1
  formula: latex_plain_v1
  text: plain_text_v1

split_policy:
  level: document
  seed: 42
  train_ratio: 0.98
  val_ratio: 0.01
