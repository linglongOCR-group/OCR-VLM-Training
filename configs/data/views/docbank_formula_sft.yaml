name: DocBank_500K_formula_sft
description: "SFT view — DocBank_500K formula recognition only"
stage: sft
model_family: mineru2.5
prompt_profile: mineru2.5

paths:
  canonical_root: canonical
  view_root: views/DocBank_500K_formula_sft

include:
  - task: formula
    sources: [DocBank_500K]

target_serialization:
  formula: latex_plain_v1

split_policy:
  level: document
  seed: 42
  train_ratio: 0.98
  val_ratio: 0.01
