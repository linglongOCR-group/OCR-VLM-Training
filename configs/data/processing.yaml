paths:
  dataset_root: ${oc.env:OCR_DATA_ROOT}
  source_root: sources
  canonical_root: canonical
  view_root: views

registries:
  source_adapters:
    hybrid_message: tools.data_management.sources.adapters.hybrid_message.HybridMessageSourceAdapter
    mineru: tools.data_management.sources.adapters.mineru.MinerUSourceAdapter
  serializers:
    mineru_layout_box_v1: tools.data_management.serializers.layout_mineru.MinerULayoutSerializer
    enhanced_otsl_v1: tools.data_management.serializers.table_otsl.EnhancedOTSLSerializer
    latex_plain_v1: tools.data_management.serializers.formula_latex.LatexPlainSerializer
    plain_text_v1: tools.data_management.serializers.text_plain.PlainTextSerializer
  rewards:
    normalized_levenshtein_v1: tools.data_management.rewards.levenshtein.NormalizedLevenshteinReward

execution:
  num_workers: 16
  deterministic: true
  log_level: INFO
