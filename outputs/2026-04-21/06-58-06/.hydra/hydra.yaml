hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - algorithm.adv_estimator=grpo
    - data.train_files=/tmp/verl-qwen25vl-3b-geo3k-smoke/train.parquet
    - data.val_files=/tmp/verl-qwen25vl-3b-geo3k-smoke/test.parquet
    - data.train_batch_size=1
    - data.max_prompt_length=512
    - data.max_response_length=32
    - data.filter_overlong_prompts=True
    - data.truncation=error
    - data.image_key=images
    - actor_rollout_ref.model.path=/tmp/Qwen2.5-VL-3B-Instruct
    - actor_rollout_ref.actor.optim.lr=1e-6
    - actor_rollout_ref.model.use_remove_padding=False
    - actor_rollout_ref.actor.ppo_mini_batch_size=1
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
    - actor_rollout_ref.actor.use_kl_loss=False
    - actor_rollout_ref.actor.entropy_coeff=0
    - actor_rollout_ref.actor.use_torch_compile=False
    - actor_rollout_ref.model.enable_gradient_checkpointing=True
    - actor_rollout_ref.actor.fsdp_config.param_offload=False
    - actor_rollout_ref.actor.fsdp_config.optimizer_offload=True
    - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1
    - actor_rollout_ref.rollout.tensor_model_parallel_size=1
    - actor_rollout_ref.rollout.name=vllm
    - +actor_rollout_ref.rollout.engine_kwargs.vllm.mm_processor_cache_gb=0
    - actor_rollout_ref.rollout.gpu_memory_utilization=0.4
    - actor_rollout_ref.rollout.max_model_len=1024
    - actor_rollout_ref.rollout.max_num_batched_tokens=1024
    - actor_rollout_ref.rollout.max_num_seqs=1
    - actor_rollout_ref.rollout.enable_chunked_prefill=False
    - actor_rollout_ref.rollout.enforce_eager=True
    - actor_rollout_ref.rollout.free_cache_engine=True
    - actor_rollout_ref.rollout.n=1
    - algorithm.use_kl_in_reward=False
    - trainer.use_legacy_worker_impl=disable
    - trainer.critic_warmup=0
    - trainer.logger=console
    - trainer.project_name=verl_grpo_example_geo3k
    - trainer.experiment_name=qwen2_5_vl_3b_npu_smoke_no_ref
    - trainer.n_gpus_per_node=1
    - trainer.nnodes=1
    - trainer.save_freq=-1
    - trainer.test_freq=-1
    - trainer.val_before_train=False
    - trainer.total_epochs=1
    - trainer.total_training_steps=1
  job:
    name: main_ppo
    chdir: null
    override_dirname: +actor_rollout_ref.rollout.engine_kwargs.vllm.mm_processor_cache_gb=0,actor_rollout_ref.actor.entropy_coeff=0,actor_rollout_ref.actor.fsdp_config.optimizer_offload=True,actor_rollout_ref.actor.fsdp_config.param_offload=False,actor_rollout_ref.actor.optim.lr=1e-6,actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1,actor_rollout_ref.actor.ppo_mini_batch_size=1,actor_rollout_ref.actor.use_kl_loss=False,actor_rollout_ref.actor.use_torch_compile=False,actor_rollout_ref.model.enable_gradient_checkpointing=True,actor_rollout_ref.model.path=/tmp/Qwen2.5-VL-3B-Instruct,actor_rollout_ref.model.use_remove_padding=False,actor_rollout_ref.rollout.enable_chunked_prefill=False,actor_rollout_ref.rollout.enforce_eager=True,actor_rollout_ref.rollout.free_cache_engine=True,actor_rollout_ref.rollout.gpu_memory_utilization=0.4,actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1,actor_rollout_ref.rollout.max_model_len=1024,actor_rollout_ref.rollout.max_num_batched_tokens=1024,actor_rollout_ref.rollout.max_num_seqs=1,actor_rollout_ref.rollout.n=1,actor_rollout_ref.rollout.name=vllm,actor_rollout_ref.rollout.tensor_model_parallel_size=1,algorithm.adv_estimator=grpo,algorithm.use_kl_in_reward=False,data.filter_overlong_prompts=True,data.image_key=images,data.max_prompt_length=512,data.max_response_length=32,data.train_batch_size=1,data.train_files=/tmp/verl-qwen25vl-3b-geo3k-smoke/train.parquet,data.truncation=error,data.val_files=/tmp/verl-qwen25vl-3b-geo3k-smoke/test.parquet,trainer.critic_warmup=0,trainer.experiment_name=qwen2_5_vl_3b_npu_smoke_no_ref,trainer.logger=console,trainer.n_gpus_per_node=1,trainer.nnodes=1,trainer.project_name=verl_grpo_example_geo3k,trainer.save_freq=-1,trainer.test_freq=-1,trainer.total_epochs=1,trainer.total_training_steps=1,trainer.use_legacy_worker_impl=disable,trainer.val_before_train=False
    id: ???
    num: ???
    config_name: ppo_trainer
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/byhou/projects/ocr-vlm-tuning
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /verl/verl/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/byhou/projects/ocr-vlm-tuning/outputs/2026-04-21/06-58-06
    choices:
      distillation: distillation
      algorithm@algorithm.rollout_correction: rollout_correction
      reward: reward
      model@critic.model: hf_model
      model@actor_rollout_ref.model: hf_model
      rollout@actor_rollout_ref.rollout: rollout
      data: legacy_data
      model_engine: dp
      critic: dp_critic
      critic/../engine@critic.fsdp: fsdp
      critic/../optim@critic.optim: fsdp
      ref@actor_rollout_ref.ref: dp_ref
      ref/../engine@actor_rollout_ref.ref.fsdp_config: fsdp
      actor@actor_rollout_ref.actor: dp_actor
      actor/../engine@actor_rollout_ref.actor.fsdp_config: fsdp
      actor/../optim@actor_rollout_ref.actor.optim: fsdp
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
